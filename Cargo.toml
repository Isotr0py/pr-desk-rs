[package]
name = "pr-desk-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
# UI 层：egui/eframe。关默认特性砍掉 wgpu/naga 栈（体积与编译内存最大来源，
# 曾在 GNU 链接时 OOM），只带 glow 渲染后端。纯逻辑测试 cargo test --lib 不依赖 UI crate。
eframe = { version = "0.37", default-features = false, features = [
    "accesskit", "clipboard", "default_fonts", "links", "glow", "system_fonts", "__screenshot",
    "x11", "wayland",
] }
egui = "0.37"
raw-window-handle = "0.6"
fontique = "0.11"
egui_extras = "0.37"
# 评审摘要的 markdown 渲染（egui 0.37 兼容版本）
egui_commonmark = "0.26"
rusqlite = { version = "0.32", features = ["bundled"] }
# socks feature：支持 socks5:// 代理（Clash 等常见代理同时提供 http/socks5 端口）；
# 注意没开 system-proxy——系统代理/环境变量一律不生效，只认配置里的显式 proxy 字段
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "socks"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "sync", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
chrono = "0.4"
anyhow = "1"
open = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
pulldown-cmark = { version = "0.12", default-features = false, features = ["simd"] }
# 头像 JPEG→PNG 归一化 / 圆形预裁（lib::circle_crop 用）
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# 系统剪贴板（复制评审报告到剪贴板）
arboard = "3"
# 数据库导入/导出的系统原生文件选择器
rfd = "0.18"

# Windows 托盘（Shell_NotifyIconW + 消息专用窗口；纯 FFI 绑定，MinGW 可编）
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell",
    "Win32_System_LibraryLoader",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std", "NSAppearance", "NSGraphics", "NSResponder", "NSView", "NSVisualEffectView",
] }

[profile.release]
# 二进制瘦身：瘦 LTO + 单编译单元 + 去符号 + abort（panic=abort 会弄坏
# cargo test --release——仓库不用它，测试跑 dev profile，无影响）
# opt-level=s：体积与运行时性能的平衡（z 更极致但可能轻微拖慢运行）
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
opt-level = "s"

[profile.dev]
# 开发构建瘦身：行级调试信息（IDE 断点不受影响），显著降低 target 体积与 rustc 内存
debug = "line-tables-only"
