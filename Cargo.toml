[package]
name = "pr-desk-rs"
version = "0.1.0"
edition = "2024"

[features]
default = ["ui"]
# Slint UI（windows 大 crate 编译吃内存；纯逻辑测试可用 --no-default-features 跳过）
ui = ["dep:slint", "dep:slint-build"]

[dependencies]
# 关默认特性砍掉 skia（约 30MB）和 software 渲染器，只留 femtovg（OpenGL）
slint = { version = "1", optional = true, default-features = false, features = [
    "std", "backend-winit", "renderer-winit-femtovg",
    "accessibility", "compat-1-2",
] }
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
chrono = "0.4"
anyhow = "1"
open = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
pulldown-cmark = { version = "0.12", default-features = false, features = ["simd"] }

[profile.release]
# 二进制瘦身：瘦 LTO + 单编译单元 + 去符号（panic=abort 会弄坏 cargo test --release，不用）
lto = "thin"
codegen-units = 1
strip = true

[build-dependencies]
slint-build = { version = "1", optional = true }
