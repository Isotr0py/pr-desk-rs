[package]
name = "pr-desk-rs"
version = "0.1.0"
edition = "2024"

[features]
default = ["ui"]
# Slint UI（windows 大 crate 编译吃内存；纯逻辑测试可用 --no-default-features 跳过）
ui = ["dep:slint", "dep:slint-build"]

[dependencies]
# 关默认特性砍掉 skia（约 30MB）。
# 注意必须用 femtovg 的 wgpu 后端：OpenGL(glutin) 后端实测会渲染坏部分文本
# （详情面板标题字形重叠，wgpu 后端正常；且 OpenGL 不支持 DWM 窗口 alpha）
# renderer-software 与 femtovg 共存：config.toml 的 renderer="software" 在启动时
# 经 SLINT_BACKEND=winit-software 切换（集显上 femtovg 整窗重绘吃紧时的备选，
# 软件渲染器支持局部重绘）
slint = { version = "1", optional = true, default-features = false, features = [
    "std", "backend-winit", "renderer-femtovg-wgpu", "renderer-software",
    "accessibility", "compat-1-2",
] }
rusqlite = { version = "0.32", features = ["bundled"] }
# socks feature：支持 socks5:// 代理（Clash 等常见代理同时提供 http/socks5 端口）；
# 注意没开 system-proxy——系统代理/环境变量一律不生效，只认配置里的显式 proxy 字段
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "socks"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
chrono = "0.4"
anyhow = "1"
open = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
pulldown-cmark = { version = "0.12", default-features = false, features = ["simd"] }
# 头像 JPEG→PNG 归一化（i-slint-core 已拉入 image 0.25，无额外编译开销）
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# 系统剪贴板（复制评审报告到剪贴板）
arboard = "3"

[profile.release]
# 二进制瘦身：瘦 LTO + 单编译单元 + 去符号（panic=abort 会弄坏 cargo test --release，不用）
lto = "thin"
codegen-units = 1
strip = true

[build-dependencies]
slint-build = { version = "1", optional = true }
